<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2C42">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>شاشة الانتظار · مركز خدمات المواطنين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* الشاشة دايمًا غامقة: بتتشاف من بعيد في صالة منورة */
  :root {
    --bg: #0B2C42;
    --panel: #10384F;
    --line: #1F4E6A;
    --ink: #FFFFFF;
    --ink-2: #A9C3D4;
    --gold: #E2B656;
    --gold-ink: #1D1404;
    --green: #8CCB6E;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
  .qno { direction: ltr; unicode-bidi: isolate; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }

  .screen { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; gap: 1.4vw; padding: 1.6vh 2.4vw; border-bottom: .5vh solid var(--gold); }
  header img { height: 7vh; width: 7vh; border-radius: 50%; background: #fff; padding: .4vh; }
  header .t { font-size: 2.6vh; color: var(--ink-2); line-height: 1.3; }
  header .t b { display: block; color: var(--ink); font-size: 3.6vh; }
  header .clock { margin-inline-start: auto; font-size: 4.4vh; font-weight: 700; font-variant-numeric: tabular-nums; }

  .body { display: grid; grid-template-columns: 1.35fr 1fr; gap: 2vw; padding: 2.4vh 2.4vw; min-height: 0; }
  /* النداء الحالي: الحاجة الوحيدة اللي تشد العين */
  .call { background: var(--gold); color: var(--gold-ink); border-radius: 2.4vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3vh; min-height: 0; }
  .call .lbl { font-size: 3.4vh; font-weight: 500; }
  .call .num { font-size: min(24vh, 15vw); line-height: 1; margin: 1.5vh 0; }
  .call .win { font-size: 6vh; font-weight: 700; line-height: 1.2; }
  .call .svc { font-size: 2.8vh; margin-top: 1vh; opacity: .8; }
  .call.idle { background: var(--panel); color: var(--ink-2); }
  .call.flash { animation: flash 1.2s ease-out 2; }
  @keyframes flash { 0% { transform: scale(1); } 15% { transform: scale(1.03); filter: brightness(1.15); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .call.flash { animation: none; } }

  .wins { background: var(--panel); border-radius: 2.4vh; padding: 2vh 2vw; display: flex; flex-direction: column; min-height: 0; }
  .wins h2 { margin: 0 0 1.2vh; font-size: 3vh; color: var(--ink-2); font-weight: 500; }
  .wins ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .9vh; overflow: hidden; }
  .wins li { display: flex; align-items: center; justify-content: space-between; gap: 1vw; padding: 1.1vh 1.2vw; border-radius: 1.4vh; background: var(--bg); }
  .wins li .n { font-size: 3.2vh; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wins li .qno { font-size: 4.6vh; color: var(--green); }
  .wins li.hot { outline: .4vh solid var(--gold); }
  .wins li .qno.none { color: var(--line); }

  footer { display: flex; align-items: center; gap: 1.6vw; padding: 1.4vh 2.4vw; background: #082234; font-size: 2.8vh; color: var(--ink-2); }
  footer .recent { display: flex; gap: 1.2vw; overflow: hidden; flex: 1; }
  footer .recent span { white-space: nowrap; background: var(--panel); border-radius: 1vh; padding: .4vh 1vw; color: var(--ink); }
  footer .recent .qno { color: var(--gold); margin-inline-end: .5vw; }
  footer .wait b { color: var(--ink); font-size: 3.6vh; }
  footer .off { color: #F08C84; }

  .gate { position: fixed; inset: 0; background: rgba(6, 25, 38, .92); display: flex; align-items: center; justify-content: center; z-index: 5; }
  .gate .box { text-align: center; max-width: 640px; padding: 4vh; }
  .gate h1 { font-size: 4vh; margin: 0 0 1.5vh; }
  .gate p { color: var(--ink-2); font-size: 2.4vh; }
  .gate button, .gate select { font: inherit; font-size: 2.8vh; border-radius: 1.4vh; padding: 1.4vh 3vw; border: 0; }
  .gate button { background: var(--gold); color: var(--gold-ink); font-weight: 700; cursor: pointer; margin-top: 2vh; }
  .gate select { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  :focus-visible { outline: .4vh solid #8DB6F5; outline-offset: .3vh; }

  @media (max-aspect-ratio: 1/1) {
    .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .call .num { font-size: 16vh; }
  }
</style>
</head>
<body>
<div class="screen">
  <header>
    <img src="icons/logo.png" alt="">
    <div class="t"><b id="city">مركز خدمات المواطنين</b>هيئة المجتمعات العمرانية الجديدة</div>
    <div class="clock" id="clock"></div>
  </header>
  <div class="body">
    <section class="call idle" id="call" aria-live="assertive">
      <div class="lbl">في انتظار أول نداء</div>
    </section>
    <section class="wins">
      <h2>الشبابيك</h2>
      <ul id="wins"></ul>
    </section>
  </div>
  <footer>
    <div class="wait" id="wait"></div>
    <div class="recent" id="recent"></div>
  </footer>
</div>
<div class="gate" id="gate"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwdwZ7ufqhUOjArfn19wt7E0nsJRrbHBC0trmNJFKsielr2ZZpARUnWOpR-LO6-qe176g/exec';
const POLL_MS = 4000;
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const arNum = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

const cityId = decodeURIComponent((location.hash || '').slice(1)) || new URLSearchParams(location.search).get('city') || '';
let state = null, lastN = null, sound = false, failed = 0;

async function api(action, payload = {}) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, payload)) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

// ---------- الساعة ----------
function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Cairo' });
}
tick(); setInterval(tick, 10000);

// ---------- الصوت ----------
let ctx = null;
function chime() {
  if (!ctx) return Promise.resolve();
  return new Promise((done) => {
    const t = ctx.currentTime;
    [[784, 0], [1047, .28]].forEach(([f, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.35, t + d + .03); g.gain.exponentialRampToValueAtTime(.001, t + d + .9);
      o.connect(g).connect(ctx.destination); o.start(t + d); o.stop(t + d + 1);
    });
    setTimeout(done, 1100);
  });
}
// "A-0007" بتتقري "رقم A سبعة"
function speakText(r) {
  const [letter, num] = String(r.q).split('-');
  return `رقم ${letter} ${Number(num) || num}، ${r.winName}`;
}
function speak(text) {
  return new Promise((done) => {
    if (!('speechSynthesis' in window)) return done();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-EG'; u.rate = .9;
    const v = speechSynthesis.getVoices().find((x) => /^ar/i.test(x.lang));
    if (v) u.voice = v;
    u.onend = u.onerror = done;
    speechSynthesis.speak(u);
    setTimeout(done, 8000);
  });
}
const announceQ = [];
let announcing = false;
async function announce(r) {
  announceQ.push(r);
  if (announcing || !sound) return;
  announcing = true;
  while (announceQ.length) {
    const x = announceQ.shift();
    await chime();
    await speak(speakText(x));
    await new Promise((d) => setTimeout(d, 400));
  }
  announcing = false;
}

// ---------- العرض ----------
function render(prevN) {
  document.getElementById('city').textContent = 'مركز خدمات المواطنين بمدينة ' + state.city;
  document.title = 'شاشة الانتظار · ' + state.city;
  const last = state.recent[0];
  const call = document.getElementById('call');
  if (last) {
    call.className = 'call';
    call.innerHTML = `<div class="lbl">الرقم المطلوب</div><div class="num qno">${esc(last.q)}</div><div class="win">${esc(last.winName)}</div>${last.svcName ? `<div class="svc">${esc(last.svcName)}</div>` : ''}`;
    if (prevN !== null && last.n > prevN) { void call.offsetWidth; call.classList.add('flash'); }
  } else {
    call.className = 'call idle';
    call.innerHTML = '<div class="lbl">في انتظار أول نداء</div>';
  }
  document.getElementById('wins').innerHTML = state.windows.map((w) => `
    <li class="${last && last.win === w.id && w.current ? 'hot' : ''}"><span class="n">${esc(w.name)}</span><span class="qno ${w.current ? '' : 'none'}">${w.current ? esc(w.current) : '—'}</span></li>`).join('');
  document.getElementById('wait').innerHTML = `في الانتظار <b>${arNum(state.waiting)}</b>`;
  document.getElementById('recent').innerHTML = state.recent.slice(1, 6).map((r) => `<span><span class="qno">${esc(r.q)}</span>${esc(r.winName)}</span>`).join('');
}

async function poll() {
  try {
    const r = await api('display', { cityId, v: state && state.v });
    failed = 0;
    if (!r.same) {
      const prevN = lastN;
      state = r;
      const newest = r.recent[0] ? r.recent[0].n : 0;
      render(prevN);
      // النداءات الجديدة من الأقدم للأحدث
      if (prevN !== null) r.recent.filter((x) => x.n > prevN).reverse().forEach(announce);
      lastN = newest;
    }
  } catch (e) {
    failed++;
    if (failed >= 3) document.getElementById('wait').innerHTML = '<span class="off">مفيش اتصال بالسيرفر</span>';
  }
  setTimeout(poll, POLL_MS);
}

// ---------- البداية ----------
// المتصفح مبيشغلش صوت غير بعد ضغطة، فأول مرة لازم حد يضغط "تشغيل الشاشة"
function start() {
  try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  sound = true;
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  document.documentElement.requestFullscreen?.().catch(() => {});
  document.getElementById('gate').hidden = true;
  poll();
}

async function gate() {
  const g = document.getElementById('gate');
  if (cityId) {
    g.innerHTML = `<div class="box"><h1>شاشة الانتظار</h1><p>اضغط علشان الشاشة تشتغل بالصوت وتملا الشاشة كلها.</p><button id="go">تشغيل الشاشة</button></div>`;
    document.getElementById('go').onclick = start;
    document.getElementById('go').focus();
    return;
  }
  g.innerHTML = '<div class="box"><h1>اختار المدينة</h1><p>جاري التحميل…</p></div>';
  try {
    const cfg = await api('config');
    g.innerHTML = `<div class="box"><h1>اختار المدينة</h1><select id="c">${cfg.cities.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select><button id="go">تشغيل الشاشة</button></div>`;
    document.getElementById('go').onclick = () => { location.hash = document.getElementById('c').value; location.reload(); };
  } catch (e) { g.innerHTML = `<div class="box"><h1>مفيش اتصال</h1><p>${esc(e.message)}</p></div>`; }
}
gate();
</script>
</body>
</html>
